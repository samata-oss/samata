# Samata production stack: prebuilt images only, nothing to clone or build.
#
#   curl -O https://raw.githubusercontent.com/<org>/samata/main/deploy/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/<org>/samata/main/deploy/.env.example
#   $EDITOR .env
#   docker compose up -d                      # includes the SIP server for phone calls
#
# Using LiveKit Cloud instead? Delete the livekit + sip services and point
# LIVEKIT_URL / LIVEKIT_PUBLIC_URL / keys in .env at your project.

services:
  # TLS for both public hostnames. Browsers require wss:// for WebRTC
  # signalling and your tool/webhook servers should only talk https.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDYFILE: |
        ${SAMATA_DOMAIN:?set SAMATA_DOMAIN} {
          reverse_proxy control-plane:3000
        }
        ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN} {
          reverse_proxy livekit:7880
        }
        # The free-demo proxy (below). Without SAMATA_DEMO_DOMAIN this is a
        # plain-HTTP site on a port nothing publishes: no certificate is
        # requested and nothing outside can reach it.
        ${SAMATA_DEMO_DOMAIN:-http://:8081} {
          reverse_proxy demo-proxy:8787
        }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '%s' "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  control-plane:
    image: ${SAMATA_IMAGE_PREFIX:?set SAMATA_IMAGE_PREFIX}/samata-control-plane:${SAMATA_VERSION:-edge}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://samata:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/samata
      SAMATA_WEBHOOK_SECRET: ${SAMATA_WEBHOOK_SECRET:?set SAMATA_WEBHOOK_SECRET}
      # Optional. Create API keys on the dashboard's API Keys page instead;
      # this one acts on the default workspace only.
      SAMATA_API_KEY: ${SAMATA_API_KEY:-}
      # Signs dashboard sessions. Changing it signs everyone out (and, unless
      # SAMATA_ENCRYPTION_KEY is set, makes stored provider keys unreadable).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Invitation links and cookies are built from this.
      BETTER_AUTH_URL: https://${SAMATA_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional: email invitations and password-reset links through Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SAMATA_EMAIL_FROM: ${SAMATA_EMAIL_FROM:-}
      SAMATA_DEFAULT_AGENT: ${SAMATA_DEFAULT_AGENT:-}
      # Handed to browsers in test tokens, so it's the public URL.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-wss://${LIVEKIT_DOMAIN}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      # Encrypts provider keys stored in the dashboard (empty: BETTER_AUTH_SECRET).
      SAMATA_ENCRYPTION_KEY: ${SAMATA_ENCRYPTION_KEY:-}
      SAMATA_ANALYSIS_MODEL: ${SAMATA_ANALYSIS_MODEL:-}
      # Where phone providers send calls: this server's SIP port (5060). Any
      # hostname/IP that reaches this machine works; LIVEKIT_DOMAIN already does.
      SAMATA_SIP_HOST: ${SAMATA_SIP_HOST:-${LIVEKIT_DOMAIN}}
      SAMATA_SIP_ALLOWED_ADDRESSES: ${SAMATA_SIP_ALLOWED_ADDRESSES:-}

  worker:
    image: ${SAMATA_IMAGE_PREFIX}/samata-worker:${SAMATA_VERSION:-edge}
    restart: unless-stopped
    depends_on:
      - livekit
      - control-plane
    # Stateless: scale with `docker compose up -d --scale worker=4`.
    deploy:
      replicas: ${SAMATA_WORKER_REPLICAS:-1}
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      SAMATA_CONTROL_PLANE_URL: http://control-plane:3000
      SAMATA_WEBHOOK_SECRET: ${SAMATA_WEBHOOK_SECRET}
      # No model provider keys: the control plane sends the workspace's keys
      # with each call (dashboard -> Provider Keys).

  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Media goes straight to the host, not through Caddy. Single-port UDP
    # mode keeps the firewall rule (and docker port mapping) to one port.
    ports:
      - "7881:7881" # WebRTC over TCP (fallback)
      - "7882:7882/udp" # WebRTC over UDP
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        room:
          empty_timeout: 30
          departure_timeout: 10
        logging:
          level: info

  sip:
    image: livekit/sip:v1.22
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
        logging:
          level: info

  # Samata Cloud's free demo for `npx @samata-oss/cli`: a metered pass-through to
  # Deepgram (speech) and OpenRouter (the model), so a quickstart with no API
  # keys of its own can still hold a conversation. Self-hosters don't need it.
  # Off unless the "demo" profile is on: put these in the server's .env (e.g.
  # with `samata deploy --env-file`) and point an A record for
  # SAMATA_DEMO_DOMAIN at the server.
  #
  #   COMPOSE_PROFILES=demo
  #   SAMATA_DEMO_DOMAIN=demo.example.com
  #   DEMO_DEEPGRAM_API_KEY=...               the Deepgram key the demo runs on
  #   DEMO_OPENROUTER_API_KEY=sk-or-v1-...    the OpenRouter key it runs on
  #   DEMO_TOKEN_SECRET=<openssl rand -hex 32>
  #
  # Spending is capped per install, per day and by those accounts' own balances,
  # and simultaneous conversations by DEMO_MAX_CONVERSATIONS, which has to stay
  # under Deepgram's connection limit for the account (see demo-proxy/src/config.mjs
  # for it and the other optional DEMO_* settings). Run one proxy: it counts
  # open connections in memory.
  demo-proxy:
    image: ${SAMATA_IMAGE_PREFIX}/samata-demo-proxy:${SAMATA_VERSION:-edge}
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      # Empty here is fine until the profile is on; the proxy then refuses to
      # start without them, with a message saying which is missing.
      DEEPGRAM_API_KEY: ${DEMO_DEEPGRAM_API_KEY:-}
      OPENROUTER_API_KEY: ${DEMO_OPENROUTER_API_KEY:-}
      DEMO_TOKEN_SECRET: ${DEMO_TOKEN_SECRET:-}
      DEMO_INSTALL_BUDGET_USD: ${DEMO_INSTALL_BUDGET_USD:-}
      DEMO_DAILY_BUDGET_USD: ${DEMO_DAILY_BUDGET_USD:-}
      DEMO_CLAIMS_PER_IP_PER_DAY: ${DEMO_CLAIMS_PER_IP_PER_DAY:-}
      DEMO_DAILY_CLAIMS: ${DEMO_DAILY_CLAIMS:-}
      DEMO_MAX_CONVERSATIONS: ${DEMO_MAX_CONVERSATIONS:-}
      DEMO_MAX_TTS_STREAMS: ${DEMO_MAX_TTS_STREAMS:-}
      DEMO_LLM_PROVIDERS: ${DEMO_LLM_PROVIDERS:-}
      DEMO_STT_USD_PER_MIN: ${DEMO_STT_USD_PER_MIN:-}
      DEMO_TTS_USD_PER_1K_CHARS: ${DEMO_TTS_USD_PER_1K_CHARS:-}
      DEMO_LLM_USD_PER_1M_IN: ${DEMO_LLM_USD_PER_1M_IN:-}
      DEMO_LLM_USD_PER_1M_OUT: ${DEMO_LLM_USD_PER_1M_OUT:-}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: samata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: samata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samata -d samata"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
