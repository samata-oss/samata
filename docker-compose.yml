# Samata local stack.
#
# Default = local stack (no profile needed): LiveKit SFU + Postgres.
# Browser-based test calls work out of the box.
#
#   docker compose up -d                              # local: livekit + postgres
#
# Real phone calls (local SIP server, needs Redis): add the SIP override file.
#
#   docker compose -f docker-compose.yml -f docker-compose.sip.yml up -d
#
# LiveKit Cloud: media runs on LiveKit Cloud, so skip the local SFU and SIP
# and start Postgres only. Set LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET
# in control-plane/.env and worker/.env, and run the worker on the host.
#
#   docker compose up -d postgres
#
# Recommended that control-plane and worker run on the host

services:
  livekit:
    image: livekit/livekit-server:v1.13
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880" # HTTP / WebSocket signalling
      - "7881:7881" # WebRTC over TCP
      - "50000-50100:50000-50100/udp" # WebRTC media
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: samata
      POSTGRES_PASSWORD: samata
      POSTGRES_DB: samata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samata -d samata"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  worker:
    build: ./worker
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      - livekit
    env_file: ./worker/.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      SAMATA_CONTROL_PLANE_URL: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
